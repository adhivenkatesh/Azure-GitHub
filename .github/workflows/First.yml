name: Hello World!

on:
  workflow_dispatch:
  push:
      branches: [ main ]

env:
  GREETING: Hello, World!
  AZURE-WEBAPPNAME: App-eastus07
  AZURE-WEBAPP-PACKAGE-PATH: "./Api1/publish"
  DOTNET_VERSION: "9.0"
  SOLUTION-PATH: "./Api1/Api1.sln"
  API-PROJECT-PATH: "./Api1/Api1.csproj"
  PUBLISH-PATH: "./publish"

jobs:
  build-and-test:
     name: Build and Test
     runs-on: ubuntu-latest

     steps:
       - uses: actions/checkout@v2
         
       - name: Set up .NET
         uses: actions/setup-dotnet@v2
         with:
           dotnet-version: ${{ env.DOTNET_VERSION }}
      
       - name: Restore dependencies
         run: dotnet restore ${{ env.SOLUTION-PATH }}

       - name: Build
         run: dotnet build ${{ env.SOLUTION-PATH }} --configuration Release --no  
      
       - name: Test
         run: dotnet test ${{ env.SOLUTION-PATH }} --configuration Release --no-build          

       - name: Publish
         run: dotnet publish ${{ env.API-PROJECT-PATH }} --configuration Release --no-restore --no-build --property:PublishDir=${{ env.PUBLISH-PATH }}
      
       - name: Publish artifacts    
         uses: azure/upload-artifact@v2
         with:
           app-name: ${{ env.AZURE-WEBAPP-PACKAGE-PATH}}
           path: ${{ env.PUBLISH-PATH }}
          
  deploy-to-azure:
      name: Deploy to Azure
      runs-on: ubuntu-latest
      needs: build-and-test
  
      steps:
        - name: Download artifact
          uses: azure/download-artifact@v2
          with:
            app-name: ${{ env.AZURE-WEBAPP-PACKAGE-PATH}}
      
        - name: Deploy
          uses: azure/webapps-deploy@v2
          with:
            app-name: ${{ env.AZURE-WEBAPPNAME }}
            publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
            package: ${{ env.AZURE-WEBAPP-PACKAGE-PATH}}
